name: Build release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    name: Relay WSL root filesystems
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build relay images and flatten them for WSL
        run: |
          mkdir -p vendor/relay-images
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" -f tools/relay/Dockerfile \
              -t "sayscore-network-relay:$arch" --load tools
            docker save "sayscore-network-relay:$arch" -o "vendor/relay-images/sayscore-network-relay-$arch.tar"
          done
          python3 scripts/build_relay_rootfs.py
      - uses: actions/upload-artifact@v4
        with:
          name: relay-rootfs
          path: vendor/relay-rootfs/
          if-no-files-found: error

  windows:
    name: Windows ZIP and installer
    needs: relay
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: relay-rootfs
          path: vendor/relay-rootfs
      - name: Version
        id: version
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.1.0.$env:GITHUB_RUN_NUMBER" }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Fetch pinned third-party components
        run: |
          ./scripts/Get-PythonRuntime.ps1
          ./scripts/Get-GhostPCL.ps1
          ./scripts/Get-SamsungDrivers.ps1
      - name: Check the bundled runtime loads the app
        run: |
          & vendor/python-x64/3.13.9/python.exe -c "import tkinter, easy_output.app, easy_output.core; print('import ok')"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build launcher
        run: ./installer/launcher/build.ps1
      - name: Package ZIP and stage installer files
        run: |
          python scripts/package_release.py
          python scripts/package_release.py --stage build/stage
      - name: Build installer
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" "/DStageDir=$PWD\build\stage" "/DOutputDir=$PWD\dist" installer\SayScorePDF.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # Code signing goes here once the SignPath Foundation project is approved:
      # sign SayScorePDF.exe before packaging and the setup .exe after this step.
      - name: Checksums
        run: |
          Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sayscore-pdf-${{ steps.version.outputs.value }}
          path: dist/
          if-no-files-found: error

  publish:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sayscore-pdf-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
