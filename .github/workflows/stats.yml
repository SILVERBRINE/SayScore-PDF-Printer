name: Update stats charts

on:
  schedule:
    - cron: "17 15 * * *"  # daily, 00:17 KST
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the stats branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin stats >/dev/null; then
            git clone --quiet --branch stats --single-branch "$remote" stats-out
          else
            git init --quiet -b stats stats-out
            git -C stats-out remote add origin "$remote"
          fi
      - name: Update history and charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_stats.py --repo "$GITHUB_REPOSITORY" --out stats-out
      - name: Publish
        working-directory: stats-out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.csv downloads.svg stars.svg
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Update stats $(date -u +%F)"
          git push --quiet origin stats
